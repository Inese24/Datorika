<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenijs tiek pie datora</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --grid: #94a3b8;
      --cell: #f8fafc;
      --cell-dark: #d1d5db;
      --blue: #3b82f6;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
      --panel: #172554;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 18px 10px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 4vw, 40px);
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      gap: 18px;
    }

    .task-card {
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .task-title {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .task-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .task-layout { grid-template-columns: 1fr; }
    }

    .map {
      display: grid;
      width: max-content;
      border: 3px solid var(--grid);
      background: var(--grid);
      gap: 3px;
      margin: 0 auto;
    }

    .cell {
      width: 86px;
      height: 86px;
      background: var(--cell);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 42px;
    }

    .blocked {
      background: #9ca3af;
    }

    .robot::after,
    .computer::after {
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    }

    .robot::after { content: "🤖"; }
    .computer::after { content: "🖥️"; }

    .path-dot {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(59,130,246,0.78);
      border: 3px solid #1d4ed8;
      z-index: 10;
      pointer-events: none;
    }

    .answer-area {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .drop-zone {
      min-height: 70px;
      border-radius: 16px;
      background: #0f172a;
      border: 2px dashed #60a5fa;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.35;
    }

    .student-step {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: #172554;
      border: 2px solid #60a5fa;
      color: #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 31px;
      font-weight: bold;
    }

    .arrow-bank {
      display: grid;
      grid-template-columns: repeat(4, 58px);
      gap: 10px;
      align-items: center;
    }

    .arrow-button {
      width: 58px;
      height: 58px;
      border: 4px solid #7c7c7c;
      background: #f8fafc;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      border-radius: 0;
    }

    .arrow-button:hover {
      outline: 4px solid rgba(96,165,250,0.45);
      outline-offset: 2px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 560px) {
      .buttons { grid-template-columns: 1fr; }
    }

    .control {
      border: 0;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #2563eb;
    }

    .control:hover { filter: brightness(1.08); }
    .secondary { background: #475569; }
    .bad { background: var(--bad); }
    .good { background: var(--good); color: #052e16; }

    .message {
      min-height: 64px;
      border-radius: 14px;
      background: var(--panel);
      color: #dbeafe;
      padding: 12px;
      font-size: 16px;
      line-height: 1.4;
      font-weight: bold;
    }

    .feedback {
      min-height: 56px;
      border-radius: 14px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 12px;
      font-size: 16px;
      line-height: 1.4;
      font-weight: bold;
    }

    .feedback.excellent {
      background: #052e16;
      border-color: var(--good);
      color: #dcfce7;
    }

    .feedback.good-job {
      background: #172554;
      border-color: #60a5fa;
      color: #dbeafe;
    }

    .feedback.try-again {
      background: #451a03;
      border-color: var(--warn);
      color: #ffedd5;
    }

    .small {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .footer-note {
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Lenijs tiek pie datora</h1>
    <p>Norādi soli vai soļus, kā lai Lenijs tiek pie datora. Klikšķini uz virziena bultām pareizā secībā.</p>
  </header>

  <main id="tasks"></main>

  <p class="footer-note">
    Materiāla ideja veidota pēc Start(IT) datorikas uzdevuma. <br>
	  &copy 2026 Inese Germane
  </p>

  <script>
    const arrowSymbols = {
      up: "↑",
      down: "↓",
      left: "←",
      right: "→"
    };

    const directionNames = {
      up: "uz augšu",
      down: "uz leju",
      left: "pa kreisi",
      right: "pa labi"
    };

    const deltas = {
      up: { r: -1, c: 0 },
      down: { r: 1, c: 0 },
      left: { r: 0, c: -1 },
      right: { r: 0, c: 1 }
    };

    const tasks = [
      {
        title: "1. uzdevums",
        rows: 2,
        cols: 3,
        robot: { r: 1, c: 1 },
        computer: { r: 0, c: 1 },
        blocked: [],
        answer: ["up"]
      },
      {
        title: "2. uzdevums",
        rows: 2,
        cols: 3,
        robot: { r: 0, c: 2 },
        computer: { r: 0, c: 1 },
        blocked: [],
        answer: ["left"]
      },
      {
        title: "3. uzdevums",
        rows: 2,
        cols: 3,
        robot: { r: 1, c: 0 },
        computer: { r: 1, c: 1 },
        blocked: [],
        answer: ["right"]
      },
      {
        title: "4. uzdevums",
        rows: 2,
        cols: 3,
        robot: { r: 0, c: 1 },
        computer: { r: 0, c: 0 },
        blocked: [],
        answer: ["left"]
      },
      {
        title: "5. uzdevums",
        rows: 3,
        cols: 3,
        robot: { r: 1, c: 1 },
        computer: { r: 0, c: 0 },
        blocked: [{ r: 1, c: 0 }],
        answer: ["up", "left"]
      },
      {
        title: "6. uzdevums",
        rows: 3,
        cols: 3,
        robot: { r: 1, c: 0 },
        computer: { r: 0, c: 1 },
        blocked: [{ r: 1, c: 1 }],
        answer: ["up", "right"]
      },
      {
        title: "7. uzdevums",
        rows: 2,
        cols: 3,
        robot: { r: 0, c: 0 },
        computer: { r: 1, c: 2 },
        blocked: [{ r: 1, c: 1 }],
        answer: ["right", "right", "down"]
      },
      {
        title: "8. uzdevums",
        rows: 2,
        cols: 3,
        robot: { r: 1, c: 0 },
        computer: { r: 0, c: 2 },
        blocked: [{ r: 1, c: 1 }],
        answer: ["up", "right", "right"]
      },
      {
        title: "9. uzdevums",
        rows: 3,
        cols: 3,
        robot: { r: 2, c: 2 },
        computer: { r: 0, c: 0 },
        blocked: [{ r: 0, c: 2 }, { r: 1, c: 0 }],
        answer: ["up", "left", "up", "left"],
        alternatives: [
          ["left", "up", "up", "left"]
        ]
      },
      {
        title: "10. uzdevums",
        rows: 3,
        cols: 3,
        robot: { r: 0, c: 2 },
        computer: { r: 2, c: 0 },
        blocked: [{ r: 1, c: 1 }, { r: 1, c: 2 }, { r: 2, c: 1 }, { r: 2, c: 2 }],
        answer: ["left", "left", "down", "down"]
      },
      {
        title: "11. uzdevums",
        rows: 2,
        cols: 3,
        robot: { r: 0, c: 2 },
        computer: { r: 1, c: 0 },
        blocked: [{ r: 0, c: 1 }],
        answer: ["down", "left", "left"]
      }
    ];

    const state = tasks.map(() => ({
      selected: [],
      attempts: 0,
      checked: false,
      solved: false
    }));

    const tasksEl = document.getElementById("tasks");

    function sameCell(a, b) {
      return a.r === b.r && a.c === b.c;
    }

    function sameSequence(a, b) {
      return a.length === b.length && a.every((item, index) => item === b[index]);
    }

    function isCorrectAnswer(task, selected) {
      const possibleAnswers = [task.answer, ...(task.alternatives || [])];
      return possibleAnswers.some(answer => sameSequence(selected, answer));
    }

    function expectedStepCount(task) {
      const possibleAnswers = [task.answer, ...(task.alternatives || [])];
      return Math.min(...possibleAnswers.map(answer => answer.length));
    }

    function isBlocked(task, r, c) {
      return task.blocked.some(cell => cell.r === r && cell.c === c);
    }

    function getPath(task, selected) {
      const path = [{ ...task.robot }];
      let current = { ...task.robot };

      for (const direction of selected) {
        const delta = deltas[direction];
        current = { r: current.r + delta.r, c: current.c + delta.c };
        path.push({ ...current });
      }

      return path;
    }

    function isValidMovePath(task, selected) {
      const path = getPath(task, selected);

      for (const point of path) {
        if (point.r < 0 || point.r >= task.rows || point.c < 0 || point.c >= task.cols) return false;
        if (isBlocked(task, point.r, point.c)) return false;
      }

      return true;
    }

    function renderAll() {
      tasksEl.innerHTML = "";
      tasks.forEach((task, index) => renderTask(task, index));
    }

    function renderTask(task, index) {
      const taskState = state[index];

      const card = document.createElement("section");
      card.className = "task-card";

      const title = document.createElement("h2");
      title.className = "task-title";
      title.textContent = task.title;

      const layout = document.createElement("div");
      layout.className = "task-layout";

      layout.appendChild(createMap(task, index));

      const answerArea = document.createElement("aside");
      answerArea.className = "answer-area";

      const dropZone = document.createElement("div");
      dropZone.className = "drop-zone";

      if (taskState.selected.length === 0) {
        dropZone.textContent = "Klikšķini uz bultām. Tavi soļi parādīsies šeit.";
      } else {
        taskState.selected.forEach(direction => {
          const step = document.createElement("div");
          step.className = "student-step";
          step.textContent = arrowSymbols[direction];
          dropZone.appendChild(step);
        });
      }

      const arrowBank = document.createElement("div");
      arrowBank.className = "arrow-bank";

      ["left", "right", "up", "down"].forEach(direction => {
        const button = document.createElement("button");
        button.className = "arrow-button";
        button.textContent = arrowSymbols[direction];
        button.title = directionNames[direction];
        button.onclick = () => chooseArrow(index, direction);
        arrowBank.appendChild(button);
      });

      const buttons = document.createElement("div");
      buttons.className = "buttons";

      const undoButton = document.createElement("button");
      undoButton.className = "control secondary";
      undoButton.textContent = "Dzēst soli";
      undoButton.onclick = () => undo(index);

      const resetButton = document.createElement("button");
      resetButton.className = "control bad";
      resetButton.textContent = "Sākt no jauna";
      resetButton.onclick = () => reset(index);

      const checkButton = document.createElement("button");
      checkButton.className = "control good";
      checkButton.textContent = "Pārbaudīt";
      checkButton.onclick = () => check(index);

      buttons.appendChild(undoButton);
      buttons.appendChild(resetButton);
      buttons.appendChild(checkButton);

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = getMessage(task, index);

      const feedback = document.createElement("div");
      feedback.className = `feedback ${getFeedbackClass(task, index)}`;
      feedback.textContent = getFeedbackText(task, index);

      const info = document.createElement("div");
      info.className = "small";
      info.innerHTML = `<strong>Izvēlēti soļi:</strong> ${taskState.selected.length} / ${expectedStepCount(task)}<br>
                        <strong>Pārbaudes mēģinājumi:</strong> ${taskState.attempts}<br>
                        <strong>Noteikums:</strong> Lenijs nedrīkst iet ārpus laukuma vai pelēkajā šķērslī.`;

      answerArea.appendChild(dropZone);
      answerArea.appendChild(arrowBank);
      answerArea.appendChild(buttons);
      answerArea.appendChild(message);
      answerArea.appendChild(feedback);
      answerArea.appendChild(info);

      layout.appendChild(answerArea);
      card.appendChild(title);
      card.appendChild(layout);
      tasksEl.appendChild(card);
    }

    function createMap(task, index) {
      const taskState = state[index];
      const map = document.createElement("div");
      map.className = "map";
      map.style.gridTemplateColumns = `repeat(${task.cols}, 86px)`;
      map.style.gridTemplateRows = `repeat(${task.rows}, 86px)`;

      const path = getPath(task, taskState.selected).filter(point =>
        point.r >= 0 && point.r < task.rows && point.c >= 0 && point.c < task.cols
      );

      for (let r = 0; r < task.rows; r++) {
        for (let c = 0; c < task.cols; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";

          if (isBlocked(task, r, c)) cell.classList.add("blocked");
          if (sameCell(task.robot, { r, c })) cell.classList.add("robot");
          if (sameCell(task.computer, { r, c })) cell.classList.add("computer");

          if (path.some(point => sameCell(point, { r, c })) && !sameCell(task.robot, { r, c })) {
            const dot = document.createElement("div");
            dot.className = "path-dot";
            cell.appendChild(dot);
          }

          map.appendChild(cell);
        }
      }

      return map;
    }

    function chooseArrow(taskIndex, direction) {
      const task = tasks[taskIndex];
      const taskState = state[taskIndex];

      if (taskState.selected.length >= expectedStepCount(task)) {
        taskState.checked = false;
        return;
      }

      taskState.selected.push(direction);
      taskState.checked = false;
      taskState.solved = false;
      renderAll();
    }

    function undo(taskIndex) {
      const taskState = state[taskIndex];

      if (taskState.selected.length === 0) return;

      taskState.selected.pop();
      taskState.checked = false;
      taskState.solved = false;
      renderAll();
    }

    function reset(taskIndex) {
      state[taskIndex] = {
        selected: [],
        attempts: 0,
        checked: false,
        solved: false
      };
      renderAll();
    }

    function check(taskIndex) {
      const task = tasks[taskIndex];
      const taskState = state[taskIndex];
      taskState.checked = true;
      taskState.attempts++;

      const chosen = taskState.selected;

      if (isCorrectAnswer(task, chosen) && isValidMovePath(task, chosen)) {
        taskState.solved = true;
      } else {
        taskState.solved = false;
      }

      renderAll();
    }

    function getMessage(task, index) {
      const taskState = state[index];

      if (!taskState.checked && taskState.selected.length === 0) {
        return "Sāc ar pirmo soli. Izvēlies bultu, kas Leniju tuvina datoram.";
      }

      if (!taskState.checked) {
        return "Turpini izvēlēties bultas pareizā secībā. Kad gatavs, spied “Pārbaudīt”.";
      }

      if (!isValidMovePath(task, taskState.selected)) {
        return "Kļūda: kāds solis izved ārpus laukuma vai pelēkajā šķērslī.";
      }

      if (taskState.solved) {
        return "Pareizi! Lenijs nokļuva pie datora.";
      }

      if (taskState.selected.length < expectedStepCount(task)) {
        return "Vēl trūkst soļu. Apskati laukumu un papildini savu atbildi.";
      }

      return "Vēl nav pareizi. Pārbaudi virzienu secību un mēģini vēlreiz.";
    }

    function getFeedbackText(task, index) {
      const taskState = state[index];

      if (taskState.solved && taskState.attempts === 1) {
        return "Izcili! Tu atradi pareizo ceļu ar pirmo mēģinājumu.";
      }

      if (taskState.solved) {
        return "Labi paveikts! Tu pārbaudīji savu darbu un atradi pareizo ceļu.";
      }

      if (taskState.checked && !taskState.solved) {
        return "Labs mēģinājums. Kļūdas palīdz mācīties — izlabo soļus un pārbaudi vēlreiz.";
      }

      if (taskState.selected.length === 0) {
        return "Uzdevums gaida tavu risinājumu. Izvēlies virziena bultu.";
      }

      return "Tu strādā pie algoritma. Salīdzini savu ceļu ar Lenija un datora atrašanās vietu.";
    }

    function getFeedbackClass(task, index) {
      const taskState = state[index];

      if (taskState.solved && taskState.attempts === 1) return "excellent";
      if (taskState.solved) return "good-job";
      if (taskState.checked && !taskState.solved) return "try-again";
      return "";
    }

    renderAll();
  </script>
</body>
</html>
