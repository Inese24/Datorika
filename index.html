<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>Datorika sākumskolai</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.5;
    }

    .section {
      margin-top: 32px;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 24px;
    }

    h2 {
      margin-top: 0;
      color: #bfdbfe;
    }

    .button-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    a {
      display: block;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 16px 18px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    a:hover {
      background: #1d4ed8;
    }

    .disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main>
    <h1>Datorika sākumskolai</h1>
    <p>Interaktīvi uzdevumi algoritmu un kodēšanas apguvei 1.–3. klasei.</p>

    <section class="section">
      <h2>Algoritmi</h2>
      <div class="button-list">
        <a href="algoritmi/kakis-draugi.html">Pie kura drauga nokļūs kaķis</a>
        <a href="algoritmi/algoritmu-varde.html">Algoritmu varde</a>
        <a href="algoritmi/martins-gramatas.html">Mārtiņš nes grāmatas</a>
        <a href="algoritmi/zime-pa-rutinam.html">Zīmē pa rūtiņām</a>
    
      </div>
    </section>

    <section class="section">
      <h2>Kodēšana</h2>
      <div class="button-list">
        <a class="disabled">Kodēšanas uzdevumi tiks pievienoti vēlāk</a>
      </div>
    </section>
  </main>
</body>
</html>
